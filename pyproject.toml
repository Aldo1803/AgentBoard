[project]
name = "agentboard"
version = "1.2.0"
description = "A local-first card board between people, coding agents and git."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
board = "agentboard:main"
agentboard = "agentboard:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["agentboard.py", "agentboard-tui.py"]
